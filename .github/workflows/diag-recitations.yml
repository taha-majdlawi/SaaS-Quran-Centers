name: diag recitations (temporary)
on:
  push:
    branches: [claude/optimistic-mccarthy-yd6fip]
    paths: [.github/workflows/diag-recitations.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only counts (no personal data)
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          q() { psql "$DB" -At -F ' | ' -c "$1" 2>&1 | head -40 | while IFS= read -r l; do echo "::notice::$2: $l"; done; }
          q "select max(version) from supabase_migrations.schema_migrations" "last migration"
          q "select to_regprocedure('public.submit_live_recitation(uuid,uuid,text,integer,integer,integer,jsonb,text,text,integer,text,uuid)') is not null" "live rpc exists"
          q "select status, source, kind, count(*), max(created_at) from public.recitation_submissions group by 1,2,3 order by 5 desc" "submissions"
          q "select count(*) from public.recitation_submissions where created_at > now() - interval '2 days'" "subs 2 days"
          q "select key, enabled, count(*) from public.organization_feature_prefs group by 1,2" "center prefs"
          q "select source, left(regexp_replace(message, '[0-9a-f]{8}-[0-9a-f-]{27}', '<id>', 'g'), 180), count, last_seen from public.app_error_groups where last_seen > now() - interval '2 days' order by last_seen desc limit 15" "errors"
          q "select count(*) filter (where c.teacher_id is null), count(*) from public.recitation_submissions r left join public.circles c on c.id = r.circle_id" "subs with no circle teacher / all"
