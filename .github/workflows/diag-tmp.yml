name: diag-tmp
on:
  push:
    branches: [diag-tmp-invite]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: memberships and invitations (read-only; masked emails)
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB" -X -A -t -c "set default_transaction_read_only = on" -c "
            select 'org: ' || o.slug || ' | admins ' || (select count(*) from public.organization_members m where m.organization_id = o.id and m.role = 'admin' and m.status = 'active')
              || ' | members ' || (select count(*) from public.organization_members m where m.organization_id = o.id)
            from public.organizations o order by o.created_at;
            select 'invite: ' || o.slug || ' | ' || i.role || ' | accepted=' || (i.accepted_at is not null) || ' | valid=' || (i.accepted_at is null and i.expires_at > now())
            from public.organization_invitations i join public.organizations o on o.id = i.organization_id order by i.created_at;
            select 'accept_invitation checks email: ' || (pg_get_functiondef('public.accept_invitation(uuid)'::regprocedure) like '%email_confirmed_at%');" 2>&1 | grep . | sed 's/^/::notice::/'
