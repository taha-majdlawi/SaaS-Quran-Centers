name: diag-tmp
on:
  push:
    branches: [diag-tmp-recite]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB" -X -A -F ' | ' -c "set default_transaction_read_only = on" \
            -c "select 'orgs', count(*) from public.organizations" \
            -c "select 'signin', max(last_sign_in_at), count(*) filter (where last_sign_in_at > now() - interval '2 days') from auth.users" \
            -c "select 'ach', max(created_at) from public.daily_achievements" \
            -c "select 'errs_all', count(*), max(last_seen) from public.app_error_groups" \
            -c "select 'objs', bucket_id, count(*), max(created_at) from storage.objects where created_at > now() - interval '7 days' group by 2" \
            -c "select 'audit', action, entity_table, count(*), max(created_at) from public.audit_log where created_at > now() - interval '2 days' group by 2,3 order by 5 desc limit 15" 2>&1 | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<uuid>/g'
