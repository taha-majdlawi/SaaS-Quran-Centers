name: diag-tmp
on:
  push:
    branches: [diag-tmp-recite]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB" -X -A -F ' | ' -c "set default_transaction_read_only = on" \
            -c "select 'subs', source, status, count(*), max(created_at) from public.recitation_submissions group by 1,2,3" \
            -c "select 'mig', max(version) from supabase_migrations.schema_migrations" \
            -c "select 'fn', proname from pg_proc where proname in ('submit_live_recitation','_recitation_audio_deletable','center_features')" \
            -c "select 'feat_off_orgs', count(*) from public.organizations o where not public.platform_feature_enabled(o.id,'recitations')" \
            -c "select 'feat_quran_off', count(*) from public.organizations o where not public.platform_feature_enabled(o.id,'quran')" \
            -c "select 'err', source, left(message,200), screen, count, last_seen from public.app_error_groups where last_seen > now() - interval '5 days' order by last_seen desc limit 40" \
            -c "select 'notif', count(*), max(created_at) from public.notifications where type like 'recitation%'" 2>&1 | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<uuid>/g'
