# Checks every change before it can reach the users: the web app builds (types
# and lint included), the mobile app analyses and its tests pass, the i18n
# files match their specs, and every migration applies to a fresh database
# where the invariants hold.
#
# Actions minutes are limited on a private repository, so: it runs on pull requests (not on
# every push to every branch), and each job only when its part changed (a change to the
# workflows themselves runs all three). A skipped job counts as passed.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      mobile: ${{ steps.diff.outputs.mobile }}
      db: ${{ steps.diff.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          # run by hand / from another workflow: check everything
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"; echo "mobile=true" >> "$GITHUB_OUTPUT"; echo "db=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          all=$(has '^\.github/workflows/')
          web=$(has '^(apps/web/|package(-lock)?\.json$)'); mobile=$(has '^apps/mobile/'); db=$(has '^supabase/')
          [ "$all" = true ] && { web=true; mobile=true; db=true; }
          echo "web=$web" >> "$GITHUB_OUTPUT"; echo "mobile=$mobile" >> "$GITHUB_OUTPUT"; echo "db=$db" >> "$GITHUB_OUTPUT"

  web:
    name: Web (build, types, lint)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the Next.js build cache: later builds only redo what changed
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - name: i18n strings match their specs
        working-directory: apps/web
        run: python3 tool/i18n/gen.py && git diff --exit-code -- src/lib/i18n
      - name: Unit tests
        run: npm test --workspace apps/web
      - name: Build
        run: npm run build --workspace apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

  mobile:
    name: Mobile (analyze, tests)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: i18n strings match their specs
        run: python3 tool/i18n/gen.py && git diff --exit-code -- lib/core/i18n
      - run: flutter analyze
      - run: flutter test

  db:
    name: Database (migrations, invariants)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration to a fresh database and run the invariants
        run: bash supabase/tests/ci/run.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
