# Copies the mushaf data (text, ayah reciters, word timings) from a public
# address into the site, on its own branch `quran-data`, ready to merge.
# Run it from GitHub: Actions -> Quran data -> Run workflow (see docs/QURAN.md).
name: Quran data

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Public base URL of the files (e.g. https://xxxx.supabase.co/storage/v1/object/public/quran)'
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and check
        env:
          SOURCE: ${{ inputs.source }}
        run: python3 tool/quran/import_quran_data.py "$SOURCE"
      - name: Commit to the quran-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B quran-data
          git add apps/web/public/quran-data apps/web/src/lib/quran/ayah-reciters.json
          git commit -m "Quran data: text, ayah reciters and word timings" || { echo "nothing changed"; exit 0; }
          git push -f origin quran-data
          echo "### Pushed to the \`quran-data\` branch - open a pull request from it to main" >> "$GITHUB_STEP_SUMMARY"
