name: tmp fetch eqraa hero
on:
  push:
    branches: [claude/optimistic-mccarthy-yd6fip]
    paths: ['.github/workflows/tmp-fetch-eqraa.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p eqraa && cd eqraa
          for f in hero-halaqa-wide hero-halaqa-sm hero-halaqa; do
            for ext in jpg webp png; do
              for base in https://www.eqraa-center.com/images https://www.eqraa-center.com/assets/images https://eqraa-center.com/images; do
                code=$(curl -sL -A "Mozilla/5.0" -o "$f.$ext" -w '%{http_code}' "$base/$f.$ext")
                if [ "$code" = 200 ] && [ $(stat -c%s "$f.$ext") -gt 5000 ]; then echo "::notice::$f.$ext $(stat -c%s $f.$ext) from $base"; break; else rm -f "$f.$ext"; fi
              done
            done
          done
          ls -la
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B tmp-eqraa-assets
          git add eqraa && git commit -m "tmp: eqraa page images" && git push -f origin tmp-eqraa-assets
