# Builds the Android app (APK) so a new version can be installed or published.
# Runs after every merge to main that touches the app, on pull requests that
# touch it, and on demand from the Actions tab ("Run workflow"). The APK is
# attached to the run as an artifact.
#
# Optional secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64      the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD    its store password
#   ANDROID_KEY_ALIAS            the key alias
#   ANDROID_KEY_PASSWORD         the key password
#   GOOGLE_SERVICES_JSON         android/app/google-services.json (push notifications)
# Without the keystore the APK is signed with a throwaway debug key: fine to
# install for testing, not accepted by Google Play.
name: Mobile build

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-build.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Push notifications config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "push: on"
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set - this build has no push notifications"
          fi

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
            {
              echo "storeFile=upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - the APK is signed with a debug key (testing only)"
            echo "kind=debug-signed" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define-from-file=env.json
          --build-number=${{ github.run_number }}

      - name: Name the file
        id: out
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          name="bustan-alquran-${v}-build${{ github.run_number }}-${{ steps.signing.outputs.kind }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: apps/mobile/${{ steps.out.outputs.name }}
          retention-days: 30
          if-no-files-found: error

      - name: Clean up the key
        if: always()
        run: rm -f android/upload.jks android/key.properties
