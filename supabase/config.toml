project_id = "bustan-alquran"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://*.bustan-alquran.com"]
jwt_expiry = 3600
enable_signup = true

[realtime]
enabled = true

# Arabic emails with the product's look (docs/EMAIL.md). On the hosted project the same
# subjects and files are pasted in Authentication -> Emails -> Templates.
[auth.email.template.confirmation]
subject = "تأكيد بريدك في بستان القرآن"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "إعادة تعيين كلمة السر - بستان القرآن"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "تأكيد بريدك الجديد - بستان القرآن"
content_path = "./supabase/templates/email_change.html"
