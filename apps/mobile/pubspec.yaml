name: quran_centers_app
description: "Multi-tenant Quran memorization center app - built on the eqraa_app foundations."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

# Dependency set mirrors eqraa_app (E:\FLUTTER PROJECTS\eqraa_app\pubspec.yaml) -
# every one of these packages already backs a working feature there, so the
# same choices carry over rather than being re-evaluated from scratch.
dependencies:
  adhan: ^2.0.0+1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  go_router: ^17.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  sqflite: ^2.4.3
  supabase_flutter: ^2.12.4
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
