name: bustan_alquran_app
description: "بستان القرآن (Bustan Al-Quran) - multi-tenant Quran memorization center app, built on the eqraa_app foundations."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

# Dependency set mirrors eqraa_app (E:\FLUTTER PROJECTS\eqraa_app\pubspec.yaml) -
# every one of these packages already backs a working feature there, so the
# same choices carry over rather than being re-evaluated from scratch.
dependencies:
  adhan: ^2.0.0+1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  go_router: ^17.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  sqflite: ^2.4.3
  supabase_flutter: ^2.12.4
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

# App icon + splash source: design/brand/ at the repo root (SVG source, PNG
# rendered from it - see design/brand/README.md). Run after any change:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false # no ios/ platform folder in this project yet - flip to true once `flutter create --platforms=ios .` is run
  image_path: assets/brand/icon-source.png
  adaptive_icon_background: '#FBF8F1'
  adaptive_icon_foreground: assets/brand/icon-foreground.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: '#1E7A54'
  image: assets/brand/splash-image.png
  color_dark: '#0B3B2E'
  image_dark: assets/brand/splash-image.png
  android_12:
    color: '#1E7A54'
    image: assets/brand/splash-image.png
    icon_background_color: '#1E7A54'
    color_dark: '#0B3B2E'
    image_dark: assets/brand/splash-image.png
    icon_background_color_dark: '#0B3B2E'

flutter:
  uses-material-design: true

  assets:
    - assets/brand/icon-source.png
    - assets/data/daily_inspirations.json

  fonts:
    # UI text: Tajawal (SIL Open Font License 1.1, see assets/fonts/Tajawal-OFL.txt)
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    # Quranic text: Amiri Quran (SIL Open Font License 1.1, see assets/fonts/OFL-AmiriQuran.txt)
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
